name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python — lint + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dev + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Cache Playwright browsers
        # ~300MB of Chromium binaries; pip's cache doesn't cover them.
        # Key on dev-requirements.txt so a Playwright bump invalidates.
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dev-requirements.txt') }}

      - name: Install Chromium for Playwright tests
        # `--with-deps` runs apt-get for system libs; ubuntu-latest already
        # has most of them so this is a few seconds even on a cache hit.
        # On miss it downloads ~300MB which the cache step catches next time.
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check fill.py upload.py tests

      - name: Format check
        run: ruff format --check fill.py upload.py tests

      - name: Import smoke test
        # Cheap pre-test guard for syntax / missing imports.
        run: python -c "import fill, upload"

      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — syntax + presence checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: JS syntax check
        run: node --check docs/app.js

      - name: HTML / asset presence
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/app.js
          test -f docs/assets/default_back.png
