name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python — lint + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check fill.py upload.py

      - name: Format check
        run: ruff format --check fill.py upload.py

      - name: Import smoke test
        # Catch obvious syntax / import errors. Does not exercise network paths.
        run: |
          python -c "import fill, upload"

  frontend:
    name: Frontend — syntax + presence checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        run: node --check docs/app.js

      - name: HTML / asset presence
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/app.js
          test -f docs/assets/default_back.png
