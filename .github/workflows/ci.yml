name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python — lint + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        # pipx is preinstalled on ubuntu-latest; this puts `poetry` on PATH so
        # setup-python's `cache: poetry` can find the lock file below.
        run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install deps
        run: poetry install

      - name: Cache Playwright browsers
        # ~300MB of Chromium binaries; the dependency cache doesn't cover them.
        # Key on poetry.lock so a Playwright bump invalidates.
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Chromium for Playwright tests
        # `--with-deps` runs apt-get for system libs; ubuntu-latest already
        # has most of them so this is a few seconds even on a cache hit.
        # On miss it downloads ~300MB which the cache step catches next time.
        run: poetry run playwright install --with-deps chromium

      - name: Lint
        run: poetry run ruff check fill.py upload.py tests

      - name: Format check
        run: poetry run ruff format --check fill.py upload.py tests

      - name: Import smoke test
        # Cheap pre-test guard for syntax / missing imports.
        run: poetry run python -c "import fill, upload"

      - name: Tests + coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — syntax + presence checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: JS syntax check
        run: node --check docs/app.js

      - name: HTML / asset presence
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/app.js
          test -f docs/assets/default_back.png
