name: Deploy GitHub Pages

# Auto-deploys docs/ to GitHub Pages on every push to main that touches the
# frontend. Replaces the legacy "deploy from /docs" Pages source — switch
# Pages → Settings → Pages → Source = "GitHub Actions" once this lands.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version.json
        # Written into the artifact so the footer can show "deployed at X · sha".
        run: |
          cat > docs/version.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ref": "${{ github.ref_name }}"
          }
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
