name: Deploy GitHub Pages

# Auto-deploys docs/ to GitHub Pages on every push to main that touches the
# frontend. Replaces the legacy "deploy from /docs" Pages source — switch
# Pages → Settings → Pages → Source = "GitHub Actions" once this lands.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp version.json
        # Written into the artifact so the footer can show the merge time +
        # commit. `committed_at` comes from the head commit (the merge commit
        # for a squashed PR), which is what the user actually cares about
        # ("when was the site last updated?"). `deployed_at` is the workflow
        # run time and is usually within seconds of the commit.
        run: |
          cat > docs/version.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "committed_at": "${{ github.event.head_commit.timestamp }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ref": "${{ github.ref_name }}"
          }
          EOF

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
